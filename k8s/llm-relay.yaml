# LLM 중계 — 수업 GPU 클러스터의 자기 namespace(studXX)에 띄운다. docs/tracks/LLM.md § 8
#
# 수업 Ollama 서버는 학교 IP 에서 온 요청만 받는다. 이 파드는 클러스터 안(학교 IP)에서
# 31434 로 들어온 요청을 Ollama 서버로 넘긴다. Mac 에서는 tools/llm/start-relay.sh 가
# kubectl port-forward 로 127.0.0.1:31434 를 이 파드에 잇는다.
#
#   앱(llm/ollamaUrl) → localhost:31434 → port-forward → llm-relay 파드 → 220.149.119.234:31434
#
# namespace 는 적지 않는다 — 현재 context 의 namespace(kubeconfig 의 studXX)에 올라간다.
# Service 는 만들지 않는다. 클러스터 밖으로 포트를 열지 않고 port-forward 로만 접근한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-relay
  labels:
    app: llm-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-relay
  template:
    metadata:
      labels:
        app: llm-relay
    spec:
      containers:
        - name: socat
          image: alpine/socat:1.8.0.1
          args:
            - TCP-LISTEN:31434,fork,reuseaddr
            - TCP:220.149.119.234:31434
          ports:
            - containerPort: 31434
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
