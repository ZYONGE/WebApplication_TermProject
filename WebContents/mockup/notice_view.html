<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공지사항 — 청사진</title>

  추가해 라우팅 페이지가 7개에서 8개가 됐다. (보고 항목 G-2)
-->
<link rel="stylesheet" href="../css/base/reset.css">
<link rel="stylesheet" href="../css/base/variables.css">
<link rel="stylesheet" href="../css/base/layout.css">
<link rel="stylesheet" href="../css/components/button.css">
<link rel="stylesheet" href="../css/components/form.css">
<link rel="stylesheet" href="../css/components/card.css">
<link rel="stylesheet" href="../css/components/table.css">
<link rel="stylesheet" href="../css/components/pagination.css">
<link rel="stylesheet" href="../css/components/popup.css">
<link rel="stylesheet" href="../css/pages/notice.css">
</head>
<body>
<div class="wrap">
<header class="page_header">
	<h1><a href="#">SHOP</a></h1>
	<ul class="page_header_util"><li>홍길동님</li><li><a href="#">마이페이지</a></li><li><a href="#">장바구니 (3)</a></li></ul>
	<nav class="page_nav"><ul><li><a href="#">전체상품</a></li><li><a href="#">의류</a></li><li><a href="#">공지사항</a></li></ul></nav>
</header>
<main class="page_content">

<h2>공지사항</h2>

<form class="notice_search" action="#" method="get">
	<input type="text" name="keyword" placeholder="제목 검색">
	<button type="submit" class="btn">검색</button>
</form>

<table class="listtable">
	<thead class="listtable_head">
		<tr><th class="col_no">번호</th><th class="col_name">제목</th>
		    <th class="col_date">작성일</th><th class="col_state">조회</th></tr>
	</thead>
	<tbody>
		<tr><td class="col_no">2</td><td class="col_name"><a href="#">배송 지연 안내</a></td>
		    <td class="col_date">2026-10-28</td><td class="col_state">124</td></tr>
		<tr><td colspan="4" class="empty">등록된 공지가 없습니다.</td></tr>
	</tbody>
</table>

<div class="paging">
	<strong class="paging_num on">1</strong>
	<a class="paging_num" href="#">2</a>
</div>

<h2>공지 상세</h2>

<article class="notice_view">
	<h2>배송 지연 안내</h2>
	<p class="field_help">2026-10-28 14:30 · 조회 124</p>
	<div class="notice_content">연휴 기간 배송이 지연될 수 있습니다.
줄바꿈이 그대로 보이는지 확인하는 두 번째 줄입니다.</div>
</article>

<div class="btnstyle">
	<a class="btn btn_sub" href="#">목록</a>
</div>

</main>
<footer class="page_footer"><p>배선 동작 확인용 골격입니다.</p></footer>
</div>
</body>
</html>
