<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>메인 — 청사진</title>
<!-- main.jsp 대응. pages/main.css + components/card.css 확인용. -->
<link rel="stylesheet" href="../css/base/reset.css">
<link rel="stylesheet" href="../css/base/variables.css">
<link rel="stylesheet" href="../css/base/layout.css">
<link rel="stylesheet" href="../css/components/button.css">
<link rel="stylesheet" href="../css/components/form.css">
<link rel="stylesheet" href="../css/components/card.css">
<link rel="stylesheet" href="../css/components/table.css">
<link rel="stylesheet" href="../css/components/pagination.css">
<link rel="stylesheet" href="../css/components/popup.css">

<body>
<div class="wrap">
<header class="page_header">
	<h1><a href="#">SHOP</a></h1>
	<ul class="page_header_util">
		<li><a href="#">로그인</a></li><li><a href="#">회원가입</a></li>
	</ul>
	<nav class="page_nav"><ul>
		<li><a href="#">전체상품</a></li><li><a href="#">의류</a></li><li><a href="#">공지사항</a></li>
	</ul></nav>
	<form class="page_search" action="#"><label for="k">상품검색</label>
		<input type="text" id="k"><button type="submit" class="btn">검색</button></form>
</header>
<main class="page_content">

<section class="main_notice">
	<h2>공지사항</h2>
	<ul>
		<li><a href="#">배송 지연 안내</a><span>2026-10-28</span></li>
		<li><a href="#">개인정보 처리방침 개정</a><span>2026-10-20</span></li>
	</ul>
	<p><a href="#">공지 전체보기</a></p>
</section>

<section class="main_new">
	<h2>신상품</h2>
	<ul class="prodlist">
		<li class="prodcard">
			<a href="#">
				<span class="prodcard_thumb">[이미지 없음]</span>
				<span class="prodcard_name">기본 티셔츠</span>
				<span class="prodcard_price">19,000원</span>
			</a>
			<span class="prodcard_badge">별점 4.5 (12)</span>
		</li>
		<li class="prodcard">
			<a href="#">
				<span class="prodcard_thumb">[이미지 없음]</span>
				<span class="prodcard_name">면 바지</span>
				<span class="prodcard_price">34,000원</span>
			</a>
			<span class="prodcard_badge">별점 4.0 (3)</span>
		</li>
		<li class="prodcard soldout">
			<a href="#">
				<span class="prodcard_thumb">[이미지 없음]</span>
				<span class="prodcard_name">품절된 상품</span>
				<span class="prodcard_price">12,000원</span>
			</a>
			<span class="prodcard_badge">별점 0.0 (0)</span>
		</li>
	</ul>
</section>

<section class="main_new">
	<h2>빈 목록 상태</h2>
	<ul class="prodlist"><li class="empty">판매 중인 상품이 없습니다.</li></ul>
</section>

</main>
<footer class="page_footer"><p>배선 동작 확인용 골격입니다.</p></footer>

</html>
